# All secrets come from environment variables. Nothing sensitive is committed.
# See backend/.env.example for the full list.
spring:
  application:
    name: mamacare-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/mamacare?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:mamacare}
    password: ${DB_PASSWORD}          # required - no default on purpose
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DDL_AUTO:update}    # dev convenience; use a migration tool (Flyway) before production
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  data:
    web:
      pageable:
        max-page-size: 100
        default-page-size: 20

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

app:
  jwt:
    secret: ${JWT_SECRET:}            # required, >= 32 characters
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
  storage:
    dir: ${STORAGE_DIR:./data/private-uploads}   # private directory, never served statically
  registration:
    require-patient-approval: ${REQUIRE_PATIENT_APPROVAL:false}
  bootstrap:
    admin-email: ${ADMIN_EMAIL:}
    admin-password: ${ADMIN_PASSWORD:}
    admin-name: ${ADMIN_NAME:MamaCare Admin}
